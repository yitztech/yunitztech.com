# Postgres efímero solo para pruebas de base de datos (npm run test:db).
# No forma parte del pipeline de GitHub. Sin volumen: los datos se pierden al bajar.
name: yunitztech-db-test
services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: yunitz_test
      POSTGRES_USER: yunitz_test
      POSTGRES_PASSWORD: yunitz_test_only
    ports: ["127.0.0.1:${DB_TEST_PORT:-55432}:5432"]
    tmpfs: [/var/lib/postgresql]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U yunitz_test -d yunitz_test"]
      interval: 2s
      timeout: 3s
      retries: 30
